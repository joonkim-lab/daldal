const VERSION = '1.0';
const LEVELS = ['A1','A2','B1','B2','C1'];
const DET = {A1:'10~20', A2:'25~55', B1:'60~95', B2:'100~125', C1:'130~150'};
const PB_N = 20, PB_PER = 4, P_NAWL = 0, P_FAKE = 30;     // 배치 테스트: 20구간×4 + 가짜 30 = 110
const GRAY_MIN = 250, GRAY_MAX = 900, FA_HARD = 0.40, FA_WARN = 0.25;
const PLACE_MAX = 3;

/* ---------- 상태 ---------- */
let WORDS = [], BYW = {}, FAKES = [];
let USER = null;      // {uid,email,name,role}
let S = null;         // 학생 진도 문서
let route = 'home';
let unsub = null;

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1800); }
function todayKey(d){ d = d || new Date(); const k = new Date(d.getTime() - d.getTimezoneOffset()*60000); return k.toISOString().slice(0,10); }
function dayNum(k){ return Math.floor(new Date(k+'T00:00:00').getTime()/86400000); }
function dow(k){ return new Date(k+'T00:00:00').getDay(); } // 0 일 … 6 토
const DOWK = ['일','월','화','수','목','금','토'];
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffled(arr, rnd){ rnd = rnd || Math.random; const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function hash(s){ let h=2166136261; for(const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h>>>0; }

/* ---------- 저장소 (Firebase 또는 로컬) ---------- */
const Store = {
  cloud: false, db: null, auth: null,
  async init(){
    if(CONFIG.firebase && window.firebase){
      firebase.initializeApp(CONFIG.firebase);
      Store.auth = firebase.auth(); Store.db = firebase.firestore();
      try{ await Store.db.enablePersistence({synchronizeTabs:true}); }catch(e){}
      Store.cloud = true;
    }
  },
  lk(k){ return 'daldal.'+k; },
  async get(col, id){
    if(Store.cloud){ const d = await Store.db.collection(col).doc(id).get(); return d.exists ? d.data() : null; }
    try{ const v = localStorage.getItem(Store.lk(col+'/'+id)); return v ? JSON.parse(v) : null; }catch(e){ return null; }
  },
  async set(col, id, data, merge){
    if(Store.cloud){ return Store.db.collection(col).doc(id).set(data, {merge:!!merge}); }
    let cur = merge ? (await Store.get(col,id) || {}) : {};
    Object.assign(cur, data);
    try{ localStorage.setItem(Store.lk(col+'/'+id), JSON.stringify(cur)); }catch(e){}
  },
  async list(col, where){
    if(Store.cloud){
      let q = Store.db.collection(col);
      if(where) q = q.where(where[0], where[1], where[2]);
      const r = await q.get(); return r.docs.map(d => ({id:d.id, ...d.data()}));
    }
    const out = [], pre = Store.lk(col+'/');
    for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k.startsWith(pre)){ const v = JSON.parse(localStorage.getItem(k)); if(!where || (where[1]==='==' ? v[where[0]]===where[2] : where[1]==='array-contains' ? (v[where[0]]||[]).includes(where[2]) : true)) out.push({id:k.slice(pre.length), ...v}); } }
    return out;
  },
  newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
};

/* ---------- 로그인 ---------- */
const Auth = {
  async start(){
    if(Store.cloud){
      Store.auth.onAuthStateChanged(async u => {
        if(!u){ USER = null; render(); return; }
        const email = (u.email||'').toLowerCase();
        const role = CONFIG.admins.map(x=>x.toLowerCase()).includes(email) ? 'admin' : (CONFIG.students[email] ? 'student' : 'none');
        USER = {uid:u.uid, email, name: CONFIG.students[email] || u.displayName || email.split('@')[0], role};
        if(role === 'none'){ render(); return; }
        await Store.set('users', u.uid, {email, name:USER.name, role, lastSeen:Date.now()}, true);
        await loadStudent(); render();
      });
    } else {
      const saved = JSON.parse(localStorage.getItem(Store.lk('local-user')) || 'null');
      if(saved){ USER = saved; await loadStudent(); }
      render();
    }
  },
  async signIn(){
    if(Store.cloud){ const p = new firebase.auth.GoogleAuthProvider(); try{ await Store.auth.signInWithPopup(p); }catch(e){ await Store.auth.signInWithRedirect(p); } }
  },
  async localSignIn(name, role){
    USER = {uid:'local-'+hash(name), email:name+'@local', name, role};
    localStorage.setItem(Store.lk('local-user'), JSON.stringify(USER));
    await Store.set('users', USER.uid, {email:USER.email, name, role}, true);
    await loadStudent(); route='home'; render();
  },
  async signOut(){ if(Store.cloud) await Store.auth.signOut(); else localStorage.removeItem(Store.lk('local-user')); USER=null; S=null; route='home'; render(); }
};

/* ---------- 학생 진도 ---------- */
function blankStudent(){
  return { v:1, diag:{}, placements:[], lo:null, hi:null, grayDone:false, cursor:0,
    days:{}, wrong:{}, settings:{showEn:true, newPerDay:CONFIG.newPerDay}, streak:0, lastStudy:null, cefr:null };
}
async function loadStudent(){
  if(!USER || USER.role !== 'student'){ S = null; return; }
  S = Object.assign(blankStudent(), await Store.get('progress', USER.uid) || {});
  S.settings = Object.assign({showEn:true, newPerDay:CONFIG.newPerDay}, S.settings||{});
}
let saveT = null;
function save(){ if(!S) return; clearTimeout(saveT); saveT = setTimeout(()=>{ if(S && USER) Store.set('progress', USER.uid, S); }, 300); }

/* ---------- 단어 데이터 ---------- */
async function loadWords(){
  const r = await fetch(CONFIG.wordsUrl + '?v=' + VERSION); const d = await r.json();
  WORDS = d.words; FAKES = d.fakes;
  WORDS.forEach((w,i) => { w.i = i; BYW[w.w] = w; });
}
function lvOf(i){ return WORDS[i] ? WORDS[i].lv : '?'; }
function levelBounds(){ const b = {}; WORDS.forEach(w => { if(!b[w.lv]) b[w.lv] = [w.i, w.i]; b[w.lv][1] = w.i; }); return b; }

/* ---------- 구역 계산 ---------- */
function isKnown(i){ const w = WORDS[i]; if(S.diag[w.w] === 'O') return true; if(S.diag[w.w] === 'X') return false; return S.lo != null && i < S.lo; }
function learnedSet(){ const s = new Set(); for(const k in S.days){ const d = S.days[k]; if(d.kind==='new' && d.test) (d.words||[]).forEach(w => s.add(w)); } return s; }
function queue(){ // 아직 배우지 않았고 모르는 단어, 순서대로
  const learned = learnedSet(); const out = [];
  for(let i = 0; i < WORDS.length; i++){ if(isKnown(i)) continue; if(learned.has(WORDS[i].w)) continue; out.push(i); }
  return out;
}
function cefrProfile(){ // 등급별 '아는 단어' 비율 (진단 + 학습 완료 반영)
  const learned = learnedSet(); const b = {}; LEVELS.forEach(l => b[l] = {n:0, k:0});
  WORDS.forEach(w => { const x = b[w.lv]; if(!x) return; x.n++; if(isKnown(w.i) || (learned.has(w.w) && (S.wrong[w.w]||0) === 0)) x.k++; });
  return b;
}

/* =====================================================================
   레벨 테스트 — 110문항(실재어 80 + 가짜 30), 최대 3회, 중앙값으로 확정
   ===================================================================== */
function buildPlacement(seed, avoid){
  const rnd = mulberry32(seed>>>0); const items = []; const N = WORDS.length; const size = N / PB_N;
  for(let b = 0; b < PB_N; b++){
    const a0 = Math.floor(b*size), a1 = Math.floor((b+1)*size);
    let pool = []; for(let i=a0;i<a1;i++) if(!avoid.has(WORDS[i].w)) pool.push(i);
    if(pool.length < PB_PER){ pool = []; for(let i=a0;i<a1;i++) pool.push(i); }
    shuffled(pool, rnd).slice(0, PB_PER).forEach(i => items.push({w:WORDS[i].w, kind:'r', bin:b, i}));
  }
  let fp = FAKES.filter(w => !avoid.has(w)); if(fp.length < P_FAKE) fp = FAKES;
  shuffled(fp, rnd).slice(0, P_FAKE).forEach(w => items.push({w, kind:'f'}));
  return shuffled(items, rnd);
}
function fitLogistic(pts, N){
  let best = {R:N/2, k:0.002, err:Infinity};
  for(let R = -N*0.15; R <= N*1.2; R += N/200){
    for(let i=0;i<28;i++){ const k = 0.0002*Math.pow(1.2,i); let err=0;
      for(const pt of pts){ const q = 1/(1+Math.exp(k*(pt.x-R))); err += (pt.p-q)*(pt.p-q); }
      if(err < best.err) best = {R,k,err}; }
  }
  return best;
}
function scorePlacement(items, answers){
  const N = WORDS.length, size = N/PB_N; let fN=0,fYes=0; const bins=[]; for(let b=0;b<PB_N;b++) bins.push({n:0,yes:0});
  for(const it of items){ const yes = !!answers[it.w]; if(it.kind==='f'){ fN++; if(yes) fYes++; } else { bins[it.bin].n++; if(yes) bins[it.bin].yes++; } }
  const fa = fN ? fYes/fN : 0;
  const corr = h => { const d = 1-fa; const v = d > .05 ? (h-fa)/d : 0; return Math.max(0, Math.min(1, v)); };
  const pts = bins.map((b,i) => ({x:(i+.5)*size, p: b.n ? corr(b.yes/b.n) : 0}));
  const fit = fitLogistic(pts, N);
  const half = Math.max(GRAY_MIN, Math.min(GRAY_MAX, Math.log(3)/fit.k));
  const lo = Math.max(0, Math.min(N-1, Math.round(fit.R - half)));
  const hi = Math.min(N, Math.max(lo+150, Math.round(fit.R + half)));
  return {R:Math.round(fit.R), k:fit.k, fa, lo, hi, bins:pts.map(q=>Math.round(q.p*100)), valid: fa < FA_HARD, at:Date.now()};
}
function finalizePlacement(){ // 유효한 회차들의 중앙값
  const ok = S.placements.filter(p => p.valid); if(!ok.length) return;
  const med = a => { const s = a.slice().sort((x,y)=>x-y); return s[Math.floor((s.length-1)/2)]; };
  const R = med(ok.map(p=>p.R)); const half = med(ok.map(p=>Math.round((p.hi-p.lo)/2)));
  S.lo = Math.max(0, Math.round(R-half)); S.hi = Math.min(WORDS.length, Math.max(S.lo+150, Math.round(R+half)));
  S.cefr = lvOf(Math.min(WORDS.length-1, R));
  // 레벨이 바뀌면 회색 구역을 다시 확인해야 함
  S.grayDone = false; save();
}

   ===================================================================== */
function weekKeys(k){ const d = new Date(k+'T00:00:00'); const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay()+6)%7)); return [0,1,2,3,4,5,6].map(i => { const x = new Date(mon); x.setDate(mon.getDate()+i); return todayKey(x); }); }
function ensureDay(k){
  if(S.days[k]) return S.days[k];
  const d = dow(k); const day = {words:[], kind: d===0 ? 'rest' : d===6 ? 'review' : 'new', learned:false, test:null};
  if(day.kind === 'new'){
    // 시험을 안 본 지난 날은 '안 한 날'로 돌리고 그 단어를 오늘로 넘긴다 (큐가 순서대로라 자동으로 앞에 온다)
    for(const k2 in S.days){ const d2 = S.days[k2]; if(k2 < k && d2.kind==='new' && !d2.test && d2.words.length){ d2.kind='skipped'; d2.words=[]; } }
    day.words = queue().slice(0, S.settings.newPerDay).map(i => WORDS[i].w); }
  if(day.kind === 'review'){ const wk = weekKeys(k).slice(0,5); const pool = []; wk.forEach(x => { const d2=S.days[x]; if(d2 && d2.kind==='new' && d2.test) pool.push(...d2.words); }); day.words = pool; }
  S.days[k] = day; save(); return day;
}
function wrongList(){ return Object.keys(S.wrong).filter(w => S.wrong[w] > 0).sort((a,b) => S.wrong[b]-S.wrong[a]); }

/* =====================================================================
   시험 — 객관식(뜻 고르기) / 주관식(철자). 매일 시험 + 관리자 지정 시험
   ===================================================================== */
function distractors(w, n, rnd){
  const same = WORDS.filter(x => x.lv === w.lv && x.w !== w.w && x.ko !== w.ko);
  return shuffled(same, rnd).slice(0, n).map(x => x.ko);
}
function buildQuestions(words, type, count, seed){
  const rnd = mulberry32(seed>>>0); let ws = shuffled(words.filter(w => BYW[w]), rnd);
  if(count && ws.length > count) ws = ws.slice(0, count);
  return ws.map((wd, i) => {
    const w = BYW[wd]; const t = type === 'mix' ? (i % 2 ? 'spell' : 'mcq') : type;
    if(t === 'mcq'){ const ch = shuffled([w.ko, ...distractors(w, 3, rnd)], rnd); return {w:wd, t, choices:ch, a:w.ko}; }
    return {w:wd, t, a:w.w};
  });
}
function normSpell(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
async function postDiscord(text){ if(!CONFIG.discordWebhook) return; try{ await fetch(CONFIG.discordWebhook, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({content:text})}); }catch(e){} }

      ${Test.submitted ? `<div style="margin-top:12px"><button class="btn" onclick="Test.next()">다음</button></div>` : ''}`;

    document.onkeydown = null; if(Test.submitted) setTimeout(()=>{ document.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); document.onkeydown=null; Test.next(); } }; }, 150);

  pick(i){ if(Test.submitted) return; const q=Test.qs[Test.idx]; Test.picked = q.choices[i]; Test.submitted=true; Test.ans.push({w:q.w, ok: Test.picked===q.a, given:Test.picked}); Test.render(); },

    const rec = {score, n, c, at:Date.now(), wrong};

    save();
    await Store.set('events', Store.newId(), {uid:USER.uid, name:USER.name, kind:Test.meta.kind, title:Test.meta.title, score, n, c, at:Date.now()});
    postDiscord(`📘 **${USER.name}** · ${Test.meta.title} · **${score}점** (${c}/${n})${wrong.length ? `\n틀린 단어: ${wrong.slice(0,10).join(', ')}${wrong.length>10?' …':''}` : ' · 전부 정답 🎉'}`);
    app.innerHTML = `

      <div class="card">${wrong.length ? `<button class="btn secondary" onclick="Test.qs=buildQuestions(${JSON.stringify(wrong).replace(/"/g,'&quot;')},'mix',30,Date.now());Test.meta={kind:'retry',title:'틀린 단어 다시'};Test.begin()">틀린 단어만 다시</button><div style="height:8px"></div>` : ''}<button class="btn" onclick="route='home';render()">홈으로</button></div>`;

// 분량 자동 조절: 최근 3회 시험이 모두 90점 이상이면 +5, 70점 미만이면 -5 (15~40)
function autoAdjust(){
  if(S.settings.auto === false) return;
  const recent = Object.keys(S.days).filter(k => S.days[k].kind==='new' && S.days[k].test).sort().slice(-3).map(k => S.days[k].test.score);
  const n = S.settings.newPerDay; let next = n;
  if(recent.length >= 3 && recent.every(x => x >= 90)) next = Math.min(40, n + 5);
  else if(recent[recent.length-1] < 70) next = Math.max(15, n - 5);
  if(next !== n){ S.settings.newPerDay = next; S.settings.lastAdjust = {from:n, to:next, at:Date.now()}; toast(`하루 단어 수 ${n} → ${next}`); }
}
function calcStreak(){ let s=0; const t = todayKey(); let d = new Date(t+'T00:00:00');
  for(let i=0;i<400;i++){ const k = todayKey(d); const day = S.days[k]; const w = dow(k);
    if(w===0){ d.setDate(d.getDate()-1); continue; }
    if(day && day.test){ s++; } else if(i===0){ /* 오늘은 아직 안 했을 수 있음 */ } else break;
    d.setDate(d.getDate()-1); }
  return s; }

      : `<h2>오늘의 ${day.words.length}단어</h2>

function Words(){
  const learned = learnedSet(); const lv = Words.lv || S.cefr || 'A1'; const qq = (Words.q||'').toLowerCase();
  let list = WORDS.filter(w => qq ? (w.w.includes(qq) || w.ko.includes(qq)) : w.lv === lv);
  if(list.length > 300) list = list.slice(0,300);
  app.innerHTML = `<h1>단어장</h1><p class="sub">${WORDS.length}단어 · A1~C1${USER.role==='student'?' · 알면 ✓ 모르면 ✗':''}</p>
    <input class="field" placeholder="검색 (영어·한글)" value="${esc(Words.q||'')}" oninput="Words.q=this.value;Words()">
    <div class="row" style="margin:10px 0"><div class="seg">${LEVELS.map(l=>`<button class="${l===lv&&!qq?'on':''}" onclick="Words.lv='${l}';Words.q='';Words()">${l}</button>`).join('')}</div>
      <div class="seg"><button class="${!S.settings.showEn?'on':''}" onclick="S.settings.showEn=false;save();Words()">한글</button><button class="${S.settings.showEn?'on':''}" onclick="S.settings.showEn=true;save();Words()">+영영</button></div></div>
    <div class="card tight"><div class="list">${list.map(w=>{ const st = S.diag[w.w]==='O' ? 'g' : learned.has(w.w) ? ((S.wrong[w.w]||0)>0?'r':'b') : (S.lo!=null && w.i<S.lo ? 'g' : ''); return `<div class="row between"><div><b>${esc(w.w)}</b> <span class="tiny">${esc(w.pos)}</span><div class="muted" style="font-size:15px">${esc(w.ko)}</div>${S.settings.showEn?`<div class="small">${esc(w.en)}</div>`:''}</div><div style="text-align:right;flex-shrink:0">${st?`<span class="pill ${st}">${st==='g'?'앎':st==='b'?'학습':'오답'}</span>`:''}${USER.role==='student'?`<br><div class="seg vx" style="margin-top:6px"><button class="${S.diag[w.w]==='O'?'on ok':''}" onclick="Words.mark('${w.w}','O')">✓</button><button class="${S.diag[w.w]==='X'?'on bad':''}" onclick="Words.mark('${w.w}','X')">✗</button></div>`:''}</div></div>`;}).join('')}</div>${list.length>=300?'<p class="small">300개까지만 표시</p>':''}</div>`;
}
Words.mark = (w,v) => { S.diag[w] = S.diag[w]===v ? undefined : v; if(S.diag[w]===undefined) delete S.diag[w]; save(); Words(); };

/* =====================================================================

const Admin = {
  tab:'kids', kids:[], tests:[], events:[],
  async load(){
    const users = await Store.list('users'); Admin.kids = [];
    for(const u of users.filter(u => u.role === 'student')){ const p = Object.assign(blankStudent(), await Store.get('progress', u.id) || {}); Admin.kids.push({...u, p}); }
    Admin.tests = (await Store.list('tests')).sort((a,b)=>b.at-a.at);
    Admin.events = (await Store.list('events')).sort((a,b)=>b.at-a.at).slice(0,50);
  },
  async render(){
    app.innerHTML = `<h1>관리</h1><p class="sub">${esc(USER.name)}</p><div class="seg" style="margin-bottom:14px"><button class="${Admin.tab==='kids'?'on':''}" onclick="Admin.tab='kids';Admin.render()">아이들</button><button class="${Admin.tab==='new'?'on':''}" onclick="Admin.tab='new';Admin.render()">시험 만들기</button><button class="${Admin.tab==='tests'?'on':''}" onclick="Admin.tab='tests';Admin.render()">결과</button></div><div id="adm"><p class="muted">불러오는 중…</p></div>`;
    await Admin.load(); const el = $('#adm'); if(!el) return;
    if(Admin.tab==='kids') el.innerHTML = Admin.kidsHtml();
    if(Admin.tab==='new') el.innerHTML = Admin.newHtml();
    if(Admin.tab==='tests') el.innerHTML = Admin.testsHtml();
  },
  kidsHtml(){
    const t = todayKey(); const wk = weekKeys(t);
    if(!Admin.kids.length) return '<div class="card"><p class="muted">아직 로그인한 학생이 없습니다.</p></div>';
    return Admin.kids.map(k => { const p = k.p; const prof = (()=>{ const b={}; LEVELS.forEach(l=>b[l]={n:0,k:0}); const learned=new Set(); for(const d in p.days)(p.days[d].words||[]).forEach(w=>learned.add(w)); WORDS.forEach(w=>{const x=b[w.lv]; if(!x)return; x.n++; const known = p.diag[w.w]==='O' || (p.diag[w.w]!=='X' && p.lo!=null && w.i<p.lo) || (learned.has(w.w) && !(p.wrong[w.w]>0)); if(known) x.k++;}); return b; })();
      const today = p.days[t]; const wrongN = Object.values(p.wrong||{}).filter(x=>x>0).length;
      return `<div class="card"><div class="row between"><div><h2 style="margin:0">${esc(k.name)}</h2><span class="small">${esc(k.email)}</span></div><span class="pill ${today&&today.test?'g':(dow(t)===0?'':'r')}">${dow(t)===0?'일요일':today&&today.test?`오늘 ${today.test.score}점`:today&&today.learned?'외우는 중':'오늘 안 함'}</span></div>
        <div class="stat" style="margin:12px 0"><div><b>${p.cefr||'—'}</b><span>레벨</span></div><div><b>${p.streak||0}</b><span>연속일</span></div><div><b>${wrongN}</b><span>틀린 단어</span></div></div>
        <div class="week">${wk.map(d=>{ const x=p.days[d]; const w=dow(d); return `<div class="${d===t?'today':''} ${x&&x.test?'done':(d<t&&w!==0?'miss':'')}"><b>${DOWK[w]}</b>${w===0?'쉼':x&&x.test?x.test.score+'점':(d<t?'—':'')}</div>`;}).join('')}</div>
        <div class="cefr" style="margin-top:10px">${LEVELS.map(l=>`<div><b>${prof[l].n?Math.round(prof[l].k/prof[l].n*100):0}<span style="font-size:11px">%</span></b><span>${l}</span></div>`).join('')}</div>
        <p class="tiny" style="margin:8px 0 0">레벨 테스트 ${p.placements.length}회 · 출발점 ${p.lo!=null?p.lo:'—'} · 배운 단어 ${Object.values(p.days).reduce((a,d)=>a+(d.words||[]).length,0)}</p></div>`; }).join('');
  },
  newHtml(){
    return `<div class="card"><h3>시험 만들기</h3>
      <label class="lbl">제목</label><input id="t-title" class="field" placeholder="예: 이번 주 B2 단어 점검">
      <label class="lbl">대상</label><div id="t-kids">${Admin.kids.map(k=>`<label class="row" style="padding:6px 0"><input type="checkbox" value="${k.id}" checked> ${esc(k.name)}</label>`).join('')||'<span class="small">학생 없음</span>'}</div>
      <label class="lbl">형식</label><div class="seg" id="t-type"><button class="on" data-v="mcq">객관식</button><button data-v="spell">철자</button><button data-v="mix">섞어서</button></div>
      <label class="lbl">단어 범위</label><div class="seg" id="t-src"><button class="on" data-v="learned">아이가 배운 단어</button><button data-v="level">등급 전체</button><button data-v="custom">직접 입력</button></div>
      <div id="t-level" class="hidden" style="margin-top:8px"><div class="seg">${LEVELS.map((l,i)=>`<button class="${i===3?'on':''}" data-v="${l}">${l}</button>`).join('')}</div></div>
      <div id="t-custom" class="hidden" style="margin-top:8px"><textarea id="t-words" class="field" placeholder="단어를 쉼표나 줄바꿈으로 구분해 입력"></textarea></div>
      <label class="lbl">문제 수</label><input id="t-count" class="field" type="number" value="30" min="5" max="100">
      <div style="height:14px"></div><button class="btn" onclick="Admin.create()">만들기</button></div>`;
  },
  async create(){
    const title = $('#t-title').value.trim() || '시험'; const kids = [...document.querySelectorAll('#t-kids input:checked')].map(x=>x.value);
    const type = $('#t-type .on').dataset.v; const src = $('#t-src .on').dataset.v; const count = Math.max(5, Math.min(100, +$('#t-count').value||30));
    let words = [];
    if(src==='custom') words = $('#t-words').value.split(/[,\n\s]+/).map(x=>x.trim().toLowerCase()).filter(x=>BYW[x]);
    else if(src==='level'){ const lv = $('#t-level .on').dataset.v; words = WORDS.filter(w=>w.lv===lv).map(w=>w.w); }
    else { const s = new Set(); Admin.kids.filter(k=>kids.includes(k.id)).forEach(k=>{ for(const d in k.p.days)(k.p.days[d].words||[]).forEach(w=>s.add(w)); }); words = [...s]; }
    if(!words.length) return toast('단어가 없습니다'); if(!kids.length) return toast('대상을 고르세요');
    words = shuffled(words).slice(0, Math.max(count, Math.min(words.length, count*3)));
    const id = Store.newId();
    await Store.set('tests', id, {title, type, count:Math.min(count, words.length), words, assignedTo:kids, createdBy:USER.uid, createdByName:USER.name, at:Date.now(), results:{}});
    const link = location.origin + location.pathname + '#test=' + id;
    Admin.tab='tests'; await Admin.render();
    try{ await navigator.clipboard.writeText(link); toast('만들었습니다 · 링크 복사됨'); }catch(e){ toast('만들었습니다'); }
    postDiscord(`📝 새 시험 **${title}** (${type==='mcq'?'객관식':type==='spell'?'철자':'섞어서'} ${Math.min(count,words.length)}문제)\n${link}`);
  },
  testsHtml(){
    const names = {}; Admin.kids.forEach(k=>names[k.id]=k.name);
    return `${Admin.tests.map(t=>{ const link = location.origin+location.pathname+'#test='+t.id; return `<div class="card tight"><div class="row between"><div><h3 style="margin:0">${esc(t.title)}</h3><span class="small">${new Date(t.at).toLocaleDateString('ko-KR')} · ${t.type==='mcq'?'객관식':t.type==='spell'?'철자':'섞어서'} ${t.count}문제 · ${esc(t.createdByName||'')}</span></div><button class="btn xs secondary" onclick="navigator.clipboard.writeText('${link}').then(()=>toast('링크 복사됨'))">링크</button></div>
      <div class="list" style="margin-top:6px">${(t.assignedTo||[]).map(uid=>{ const r=(t.results||{})[uid]; return `<div class="row between"><span>${esc(names[uid]||uid)}</span>${r?`<span><span class="pill ${r.score>=80?'g':r.score>=60?'a':'r'}">${r.score}점</span> <span class="small">${r.c}/${r.n} · ${new Date(r.at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'})}</span>${r.wrong&&r.wrong.length?`<div class="tiny">틀림: ${r.wrong.join(', ')}</div>`:''}</span>`:'<span class="pill">아직</span>'}</div>`;}).join('')}</div></div>`;}).join('') || '<div class="card"><p class="muted">만든 시험이 없습니다.</p></div>'}
      <div class="card tight"><h3>최근 활동</h3><div class="list">${Admin.events.map(e=>`<div class="row between"><span><b>${esc(e.name)}</b> <span class="muted">${esc(e.title)}</span></span><span class="small">${e.score}점 · ${new Date(e.at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'})}</span></div>`).join('')||'<span class="small">없음</span>'}</div></div>`;
  }
};

    ${Store.cloud ? `<button class="btn" onclick="Auth.signIn()">Google로 로그인</button>`
    : `<div class="card" style="text-align:left"><p class="small">Firebase 설정이 없어 이 기기에만 저장합니다.</p><label class="lbl">이름</label><input id="ln" class="field" placeholder="이름"><div style="height:10px"></div><button class="btn" onclick="Auth.localSignIn($('#ln').value.trim()||'학생','student')">학생으로 시작</button><div style="height:8px"></div><button class="btn plain" onclick="Auth.localSignIn($('#ln').value.trim()||'관리자','admin')">관리자로 시작</button></div>`}
    <div class="footer">제작 Educclesia Group</div></div>`;
}

/* ---------- 라우팅 ---------- */
const NAVS = { student:[['home','홈','M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'],['words','단어장','M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 0-3 3zM4 4v16a3 3 0 0 1 3-3h12'],['settings','설정','M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm7-3a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1l-.4-2.6h-4l-.4 2.6a7 7 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6c.1-.3.1-.7.1-1z']],
  admin:[['admin','관리','M3 3h18v18H3zM3 9h18M9 21V9'],['words','단어장','M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 0-3 3zM4 4v16a3 3 0 0 1 3-3h12'],['asettings','설정','M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z']] };
function renderNav(){
  const nav = $('#nav'); if(!USER || USER.role==='none' || ['place','gray','study','test'].includes(route)){ nav.classList.add('hidden'); return; }
  nav.classList.remove('hidden');
  nav.innerHTML = NAVS[USER.role].map(([r,l,p])=>`<button class="${route===r?'on':''}" onclick="route='${r}';render()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="${p}"/></svg>${l}</button>`).join('');
}
async function render(){
  window.scrollTo(0,0);
  if(!USER || USER.role==='none'){ Login(); renderNav(); return; }
  if(USER.role==='admin' && ['home','settings'].includes(route)) route = 'admin';
  if(USER.role==='student' && route==='admin') route='home';
  renderNav();
  if(USER.role==='student'){
    if(route==='home') await Home(); else if(route==='place') Place.render(); else if(route==='gray') Gray.render(); else if(route==='study') Study.render(); else if(route==='test') Test.render(); else if(route==='words') Words(); else if(route==='settings') Settings();
  } else {
    if(route==='admin') await Admin.render(); else if(route==='words'){ S = S || blankStudent(); Words(); } else if(route==='asettings') app.innerHTML = `<h1>설정</h1><p class="sub">${esc(USER.email)}</p><div class="card"><button class="btn danger" onclick="Auth.signOut()">로그아웃</button></div><div class="footer">달달 v${VERSION} · 제작 Educclesia Group</div>`;
  }
}
async function openAssignedFromHash(){
  const m = location.hash.match(/#test=([a-z0-9]+)/); if(!m || !USER || USER.role!=='student') return;
  const t = await Store.get('tests', m[1]); if(!t) return toast('시험을 찾을 수 없어요');
  if((t.results||{})[USER.uid]) return toast('이미 본 시험이에요');
  history.replaceState(null,'',location.pathname); Test.startAssigned({id:m[1], ...t});
}
window.addEventListener('hashchange', openAssignedFromHash);

/* ---------- 시작 ---------- */
(async function main(){
  app.innerHTML = '<p class="muted" style="margin-top:40vh;text-align:center">불러오는 중…</p>';
  try{ await loadWords(); }catch(e){ app.innerHTML = `<div class="card" style="margin-top:30vh"><h3>단어 데이터를 불러오지 못했습니다</h3><p class="small">${esc(e.message)}</p></div>`; return; }
  await Store.init(); await Auth.start();
  const _r = render; window.render = async function(){ await _r(); };
  setTimeout(openAssignedFromHash, 400);
  if(location.search.includes('selftest=1')) runSelfTest();
})();

/* ---------- 내장 셀프테스트 ---------- */
function runSelfTest(){
  const out = []; const ck = (n, c) => out.push((c?'PASS ':'FAIL ') + n);
  ck('단어 수 5000+', WORDS.length > 5000);
  ck('모든 단어 한글 뜻', WORDS.every(w => w.ko && w.ko.length));
  ck('모든 단어 영영 뜻', WORDS.every(w => w.en && w.en.length));
  ck('등급 순서 단조', WORDS.every((w,i) => i===0 || LEVELS.indexOf(w.lv) >= LEVELS.indexOf(WORDS[i-1].lv)));
  ck('가짜 단어가 실재어 아님', FAKES.every(f => !BYW[f]));
  const items = buildPlacement(123, new Set()); ck('배치 110문항', items.length === PB_N*PB_PER + P_FAKE);
  const honest = {}; items.forEach(it => honest[it.w] = it.kind==='r' && it.i < 2000);
  const r1 = scorePlacement(items, honest); ck('정직한 학생 경계 ≈ 2000 (got '+r1.R+')', Math.abs(r1.R-2000) < 450);
  const all = {}; items.forEach(it => all[it.w] = true); ck('전부 안다 → 무효', !scorePlacement(items, all).valid);
  const liar = {}; items.forEach(it => liar[it.w] = it.kind==='f' ? (hash(it.w)%2===0) : it.i < 2000); const r3 = scorePlacement(items, liar); ck('가짜 절반 안다 → 보정 후 ±500 (got '+r3.R+')', Math.abs(r3.R-2000) < 500);
  S = blankStudent(); USER = {uid:'t', name:'t', role:'student'}; S.lo = 1000; S.hi = 1400; S.grayDone = true;
  const q = queue(); ck('큐가 lo부터', q[0] === 1000);
  const d = ensureDay('2026-10-12'); ck('월요일 기본 분량', d.kind==='new' && d.words.length===CONFIG.newPerDay);
  const qs = buildQuestions(d.words, 'mix', 30, 7); ck('시험 객관식/철자 반반', qs.length===d.words.length && qs.filter(x=>x.t==='mcq').length===d.words.length/2);
  ck('객관식 보기 4개·정답 포함', qs.filter(x=>x.t==='mcq').every(x => x.choices.length===4 && x.choices.includes(x.a)));
  const sat = ensureDay('2026-10-17'); ck('토요일 주간 복습', sat.kind==='review');
  ck('일요일 쉼', ensureDay('2026-10-18').kind==='rest');
  const fails = out.filter(x=>x.startsWith('FAIL')).length; document.title = fails ? 'SELFTEST-FAIL' : 'SELFTEST-PASS';
  app.innerHTML = `<h1>셀프테스트 ${fails?'실패':'통과'}</h1><pre style="font-size:13px;white-space:pre-wrap">${out.join('\n')}</pre>`;
  S = null; USER = null;
}
</script>
